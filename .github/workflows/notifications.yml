name: Diyetim Bildirimleri

on:
  schedule:
    # ── Türkiye saati UTC+3 ──────────────────────────
    # 07:00 TR → Kahvaltı (04:00 UTC)
    - cron: '0 4 * * *'
    # 08:00 - 22:00 TR → Her saat başı (05:00 - 19:00 UTC)
    - cron: '0 5-19 * * *'
    # 12:30 TR → Yürüyüş (09:30 UTC)
    - cron: '30 9 * * *'

  # Manuel test için
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Bildirimi Belirle ve Gönder
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_HOUR_INT=$((10#$UTC_HOUR))
          TR_HOUR_INT=$(( (UTC_HOUR_INT + 3) % 24 ))
          MINUTE=$(date -u +%M)

          echo "UTC Saat: $UTC_HOUR:$MINUTE"
          echo "Türkiye Saati: $TR_HOUR_INT:$MINUTE"

          TITLE=""
          MESSAGE=""

          # 07:00 TR → Kahvaltı
          if [ "$TR_HOUR_INT" = "7" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Kahvaltı Vakti! 🍳"
            MESSAGE="Güne zinde başlamak için kahvaltı saati! Yumurtan ve ekmeğin hazır mı?"

          # 08:00 TR → Su & Motivasyon
          elif [ "$TR_HOUR_INT" = "8" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Su İçme Zamanı! 💧"
            MESSAGE="Yeni ve sağlıklı bir güne bir bardak su ile başla. Günaydın!"

          # 09:00 TR → Motivasyon
          elif [ "$TR_HOUR_INT" = "9" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Motivasyon & Su! ✨"
            MESSAGE="Dün dündü, bugün yeni bir gün! Kendine inan ve taze bir bardak su iç."

          # 10:00 TR → Su
          elif [ "$TR_HOUR_INT" = "10" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Su Molası! 💧"
            MESSAGE="Vücudunu susuz bırakma. Şimdi büyük bir bardak su alıp yudumlama vakti."

          # 11:00 TR → Motivasyon
          elif [ "$TR_HOUR_INT" = "11" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Motivasyon Zamanı! 🌟"
            MESSAGE="Her yudum su, hedefine giden bir adımdır. Suyunu iç, enerjini topla!"

          # 12:00 TR → Öğle Yemeği
          elif [ "$TR_HOUR_INT" = "12" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Öğle Yemeği Vakti! 🥗"
            MESSAGE="Öğle yemeği saati geldi! Dengeli ve hafif beslenerek formda kal."

          # 12:30 TR → Yürüyüş
          elif [ "$TR_HOUR_INT" = "12" ] && [ "$MINUTE" = "30" ]; then
            TITLE="Yürüyüş & Spor Zamanı! 🏃"
            MESSAGE="Günlük 6.000 adım atmaya çalış! Şimdi kısa bir yürüyüşe çıksan bile harika bir başlangıç olur. Ayağa kalk, hareket et! 💪"

          # 13:00 TR → Su
          elif [ "$TR_HOUR_INT" = "13" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Su İçme Zamanı! 💧"
            MESSAGE="Yemekten sonra hazmı kolaylaştırmak için güzel bir bardak su içelim."

          # 14:00 TR → Motivasyon & Su
          elif [ "$TR_HOUR_INT" = "14" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Öğleden Sonra Canlanması! ⚡"
            MESSAGE="Öğleden sonra yorgunluğuna teslim olma. Büyük bir bardak su iç ve canlan!"

          # 15:00 TR → Motivasyon
          elif [ "$TR_HOUR_INT" = "15" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Motivasyon & Su! 🎯"
            MESSAGE="Küçük adımlar büyük sonuçlar doğurur. Hedefine sadık kal, suyunu ihmal etme."

          # 16:00 TR → Su
          elif [ "$TR_HOUR_INT" = "16" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Su Molası! 💧"
            MESSAGE="Diyetinin en yakın arkadaşı sudur. Bir bardak su içip metabolizmanı hızlandır."

          # 17:00 TR → Motivasyon & Su
          elif [ "$TR_HOUR_INT" = "17" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Günün Özeti! 🌟"
            MESSAGE="Bugün hedeflerine ne kadar yaklaştın? Suyunu iç ve motivasyonunu koru."

          # 18:00 TR → Akşam Yemeği
          elif [ "$TR_HOUR_INT" = "18" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Akşam Yemeği Vakti! 🍗"
            MESSAGE="Akşam yemeği saati! Protein ve sebze ağırlıklı öğününle günü hafif bitir."

          # 19:00 TR → Su
          elif [ "$TR_HOUR_INT" = "19" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Akşam Su Molası! 💧"
            MESSAGE="Akşam dinlenmesine geçmeden önce günün son büyük su bardağını doldur."

          # 20:00 TR → Motivasyon & Su
          elif [ "$TR_HOUR_INT" = "20" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Son Viraj Motivasyonu! 💪"
            MESSAGE="Bugünü harika yönettin! Kaçamak yapmadan günü bitirmek üzeresin, suyla devam."

          # 21:00 TR → Gece Arası
          elif [ "$TR_HOUR_INT" = "21" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Gece Arası Vakti! 🥛"
            MESSAGE="Günün son hafif öğünü! Yulaflı sütün ve tarçınlı muzun hazır mı?"

          # 22:00 TR → Su
          elif [ "$TR_HOUR_INT" = "22" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Günlük Su Kontrolü! 💧"
            MESSAGE="Bugün toplam en az 3 litre su içtin mi? 💧 Günü kapatmadan son bardağını içmeyi unutma. Harika bir gün geçirdin, yarın da devam! 🌙"
          fi

          # Eğer bildirim tanımlandıysa gönder
          if [ -n "$TITLE" ]; then
            echo "Gönderiliyor: $TITLE"
            curl -s -X POST "https://onesignal.com/api/v1/notifications" \
              -H "Authorization: Basic $ONESIGNAL_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"app_id\": \"$ONESIGNAL_APP_ID\",
                \"filters\": [
                  {\"field\": \"tag\", \"key\": \"hour_$TR_HOUR_INT\", \"relation\": \"=\", \"value\": \"true\"},
                  {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}
                ],
                \"headings\": {\"tr\": \"$TITLE\", \"en\": \"$TITLE\"},
                \"contents\": {\"tr\": \"$MESSAGE\", \"en\": \"$MESSAGE\"},
                \"small_icon\": \"ic_stat_onesignal_default\",
                \"android_accent_color\": \"FFb8d8be\"
              }"
            echo ""
            echo "Bildirim gönderildi!"
          else
            echo "Bu saat için bildirim tanımlı değil. (TR Saat: $TR_HOUR_INT:$MINUTE)"
          fi
