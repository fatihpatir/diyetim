name: Diyetim Bildirimleri

on:
  schedule:
    # ── Türkiye saati UTC+3 ──────────────────────────
    # 07:00 TR → Kahvaltı (04:00 UTC)
    - cron: '0 4 * * *'
    # 08:00 - 22:00 TR → Her yarım saatte bir (05:00 - 19:00 UTC arası her 30 dakikada bir)
    - cron: '*/30 5-19 * * *'
    # 12:30 TR → Yürüyüş (09:30 UTC) - standard 12:30 trigger for walk
    - cron: '30 9 * * *'

  # Manuel test için
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Bildirimi Belirle ve Gönder
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_HOUR_INT=$((10#$UTC_HOUR))
          TR_HOUR_INT=$(( (UTC_HOUR_INT + 3) % 24 ))
          MINUTE=$(date -u +%M)

          echo "UTC Saat: $UTC_HOUR:$MINUTE"
          echo "Türkiye Saati: $TR_HOUR_INT:$MINUTE"

          TITLE=""
          MESSAGE=""
          FILTERS=""

          # 1. Yürüyüş uyarısı (12:30 TR) - En spesifik olanı en üstte tutuyoruz
          if [ "$TR_HOUR_INT" = "12" ] && [ "$MINUTE" = "30" ]; then
            TITLE="Yürüyüş & Spor Zamanı! 🏃"
            MESSAGE="Günlük 6.000 adım atmaya çalış! Şimdi kısa bir yürüyüşe çıksan bile harika bir başlangıç olur. Ayağa kalk, hareket et! 💪"
            FILTERS="[{\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"

          # 2. Kahvaltı (07:00 TR)
          elif [ "$TR_HOUR_INT" = "7" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Kahvaltı Vakti! 🍳"
            MESSAGE="Güne zinde başlamak için kahvaltı saati! Yumurtan ve ekmeğin hazır mı?"
            FILTERS="[{\"field\": \"tag\", \"key\": \"hour_7\", \"relation\": \"=\", \"value\": \"true\"}, {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"

          # 3. Akşam Yemeği (18:00 TR)
          elif [ "$TR_HOUR_INT" = "18" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Akşam Yemeği Vakti! 🍗"
            MESSAGE="Akşam yemeği saati! Protein ve sebze ağırlıklı öğününle günü hafif bitir."
            FILTERS="[{\"field\": \"tag\", \"key\": \"hour_18\", \"relation\": \"=\", \"value\": \"true\"}, {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"

          # 4. Gece Arası (21:00 TR)
          elif [ "$TR_HOUR_INT" = "21" ] && [ "$MINUTE" = "00" ]; then
            TITLE="Gece Arası Vakti! 🥛"
            MESSAGE="Günün son hafif öğünü! Yulaflı sütün ve tarçınlı muzun hazır mı?"
            FILTERS="[{\"field\": \"tag\", \"key\": \"hour_21\", \"relation\": \"=\", \"value\": \"true\"}, {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"

          # 5. Diğer saat başı bildirimleri (:00)
          elif [ "$MINUTE" = "00" ]; then
            FILTERS="[{\"field\": \"tag\", \"key\": \"hour_$TR_HOUR_INT\", \"relation\": \"=\", \"value\": \"true\"}, {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"
            
            if [ "$TR_HOUR_INT" = "8" ]; then
              TITLE="Su İçme Zamanı! 💧"
              MESSAGE="Yeni ve sağlıklı bir güne bir bardak su ile başla. Günaydın!"
            elif [ "$TR_HOUR_INT" = "9" ]; then
              TITLE="Motivasyon & Su! ✨"
              MESSAGE="Dün dündü, bugün yeni bir gün! Kendine inan ve taze bir bardak su iç."
            elif [ "$TR_HOUR_INT" = "10" ]; then
              TITLE="Su Molası! 💧"
              MESSAGE="Vücudunu susuz bırakma. Şimdi büyük bir bardak su alıp yudumlama vakti."
            elif [ "$TR_HOUR_INT" = "11" ]; then
              TITLE="Motivasyon Zamanı! 🌟"
              MESSAGE="Her yudum su, hedefine giden bir adımdır. Suyunu iç, enerjini topla!"
            elif [ "$TR_HOUR_INT" = "12" ]; then
              TITLE="Öğle Yemeği Vakti! 🥗"
              MESSAGE="Öğle yemeği saati geldi! Dengeli ve hafif beslenerek formda kal."
            elif [ "$TR_HOUR_INT" = "13" ]; then
              TITLE="Su İçme Zamanı! 💧"
              MESSAGE="Yemekten sonra hazmı kolaylaştırmak için güzel bir bardak su içelim."
            elif [ "$TR_HOUR_INT" = "14" ]; then
              TITLE="Öğleden Sonra Canlanması! ⚡"
              MESSAGE="Öğleden sonra yorgunluğuna teslim olma. Büyük bir bardak su iç ve canlan!"
            elif [ "$TR_HOUR_INT" = "15" ]; then
              TITLE="Motivasyon & Su! 🎯"
              MESSAGE="Küçük adımlar büyük sonuçlar doğurur. Hedefine sadık kal, suyunu ihmal etme."
            elif [ "$TR_HOUR_INT" = "16" ]; then
              TITLE="Su Molası! 💧"
              MESSAGE="Diyetinin en yakın arkadaşı sudur. Bir bardak su içip metabolizmanı hızlandır."
            elif [ "$TR_HOUR_INT" = "17" ]; then
              TITLE="Günün Özeti! 🌟"
              MESSAGE="Bugün hedeflerine ne kadar yaklaştın? Suyunu iç ve motivasyonunu koru."
            elif [ "$TR_HOUR_INT" = "19" ]; then
              TITLE="Akşam Su Molası! 💧"
              MESSAGE="Akşam dinlenmesine geçmeden önce günün son büyük su bardağını doldur."
            elif [ "$TR_HOUR_INT" = "20" ]; then
              TITLE="Son Viraj Motivasyonu! 💪"
              MESSAGE="Bugünü harika yönettin! Kaçamak yapmadan günü bitirmek üzeresin, suyla devam."
            elif [ "$TR_HOUR_INT" = "22" ]; then
              TITLE="Günlük Su Kontrolü! 💧"
              MESSAGE="Bugün toplam en az 3 litre su içtin mi? 💧 Günü kapatmadan son bardağını içmeyi unutma. Harika bir gün geçirdin, yarın da devam! 🌙"
            fi

          # 6. Diğer yarım saat bildirimleri (:30)
          elif [ "$MINUTE" = "30" ]; then
            FILTERS="[{\"field\": \"tag\", \"key\": \"halfhour_$TR_HOUR_INT\", \"relation\": \"=\", \"value\": \"true\"}, {\"field\": \"tag\", \"key\": \"water_reminder\", \"relation\": \"=\", \"value\": \"true\"}]"

            if [ "$TR_HOUR_INT" = "8" ]; then
              TITLE="Su Hatırlatması! 💧"
              MESSAGE="Günün erken saatlerinde su içerek enerjini yüksek tut!"
            elif [ "$TR_HOUR_INT" = "9" ]; then
              TITLE="Kısa Bir Mola! 🧘"
              MESSAGE="Hafifçe gerin ve büyük bir yudum su içerek tazelen."
            elif [ "$TR_HOUR_INT" = "10" ]; then
              TITLE="Su Zamanı! 💧"
              MESSAGE="Diyetinde istikrarlı gidiyorsun, bir bardak su ile kendini ödüllendir."
            elif [ "$TR_HOUR_INT" = "11" ]; then
              TITLE="Canlanma Vakti! ✨"
              MESSAGE="Öğle yemeği öncesi metabolizmanı canlandırmak için suyunu iç."
            elif [ "$TR_HOUR_INT" = "13" ]; then
              TITLE="Su Hatırlatması! 💧"
              MESSAGE="Öğleden sonra rehavetine kapılma, suyunu yudumla!"
            elif [ "$TR_HOUR_INT" = "14" ]; then
              TITLE="Motivasyon Molası! 🎯"
              MESSAGE="Hedeflerine ulaşmak için harika bir gün. Suyunu ihmal etme."
            elif [ "$TR_HOUR_INT" = "15" ]; then
              TITLE="Su Zamanı! 💧"
              MESSAGE="Kendine bir iyilik yap ve şimdi taze bir bardak su al."
            elif [ "$TR_HOUR_INT" = "16" ]; then
              TITLE="Küçük Hatırlatma! 🌟"
              MESSAGE="Sağlığın ve formun için su içmeyi unutma."
            elif [ "$TR_HOUR_INT" = "17" ]; then
              TITLE="Akşamüstü Tazeliği! ⚡"
              MESSAGE="Akşam yemeği öncesi güzel bir bardak su içelim."
            elif [ "$TR_HOUR_INT" = "18" ]; then
              TITLE="Su Molası! 💧"
              MESSAGE="Akşam yemeğinden sonra vücudunu susuz bırakma."
            elif [ "$TR_HOUR_INT" = "19" ]; then
              TITLE="Motivasyon & Su! 💪"
              MESSAGE="Günün yorgunluğunu bir bardak su ile atlat."
            elif [ "$TR_HOUR_INT" = "20" ]; then
              TITLE="Su Zamanı! 💧"
              MESSAGE="Akşam saatlerinde de hidrasyonunu korumaya devam et."
            elif [ "$TR_HOUR_INT" = "21" ]; then
              TITLE="Gece Dinlenmesi! 🌙"
              MESSAGE="Günü kapatırken hafif bir bardak su veya bitki çayı içebilirsin."
            fi
          fi

          # Eğer bildirim tanımlandıysa gönder
          if [ -n "$TITLE" ] && [ -n "$FILTERS" ]; then
            echo "Gönderiliyor: $TITLE"
            curl -s -X POST "https://onesignal.com/api/v1/notifications" \
              -H "Authorization: Basic $ONESIGNAL_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"app_id\": \"$ONESIGNAL_APP_ID\",
                \"filters\": $FILTERS,
                \"headings\": {\"tr\": \"$TITLE\", \"en\": \"$TITLE\"},
                \"contents\": {\"tr\": \"$MESSAGE\", \"en\": \"$MESSAGE\"},
                \"small_icon\": \"ic_stat_onesignal_default\",
                \"android_accent_color\": \"FFb8d8be\"
              }"
            echo ""
            echo "Bildirim gönderildi!"
          else
            echo "Bu saat veya dakika için bildirim tanımlı değil veya filtre bulunamadı. (TR Saat: $TR_HOUR_INT:$MINUTE)"
          fi
